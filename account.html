<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Dado Bucks Bank</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑🏽‍💼</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🧑🏽‍💼 Dado Bucks Bank</h1>
    <div class="sub" id="profile-sub">Your very own money adventure!</div>
  </header>

  <nav class="tabs" id="nav-tabs"></nav>

  <div id="lock-view" class="card lock-screen" style="display:none;">
    <div class="lock-emoji">🔒</div>
    <h2 style="font-family:'Baloo 2',sans-serif;">Enter <span id="lock-name">Kid</span>'s Passcode</h2>
    <input type="password" id="passcode-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <div class="error-msg" id="passcode-error"></div>
    <button class="btn btn-blue" id="unlock-btn">Unlock</button>
  </div>

  <div id="not-found-view" class="card" style="display:none; text-align:center;">
    <p>We couldn't find that kid's profile.</p>
    <a href="index.html" class="btn btn-blue" style="display:inline-block; text-decoration:none;">⬅ Back to Profiles</a>
  </div>

  <div id="content-view" style="display:none;">
    <div id="mode-banner-holder"></div>

    <div class="card balance-card">
      <div class="coin">💰</div>
      <div class="label">Your Balance</div>
      <div class="amount"><span id="balance">0</span> <span class="unit">DB</span></div>
      <div style="color:#92660a; font-weight:600;">Dado Bucks</div>
    </div>

    <h2 class="section-title">✨ Recent Activity</h2>
    <div class="card">
      <ul class="txn-list" id="recent-list">
        <li class="empty-state">Loading...</li>
      </ul>
    </div>
  </div>

  <footer class="foot">Keep earning, keep saving! 🌟</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/account.js"></script>
</body>
</html>
