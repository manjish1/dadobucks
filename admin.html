<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Dado Bucks Bank</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑🏽‍💼</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🧑🏽‍💼 Dado Bucks Bank</h1>
    <div class="sub" id="profile-sub">Parent Admin Zone</div>
  </header>

  <nav class="tabs" id="nav-tabs"></nav>

  <div id="lock-view" class="card lock-screen" style="display:none;">
    <div class="lock-emoji">🔒</div>
    <h2 style="font-family:'Baloo 2',sans-serif;">Enter <span id="lock-name">Kid</span>'s Passcode</h2>
    <input type="password" id="passcode-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <div class="error-msg" id="passcode-error"></div>
    <button class="btn btn-blue" id="unlock-btn">Unlock</button>
  </div>

  <div id="not-found-view" class="card" style="display:none; text-align:center;">
    <p>We couldn't find that kid's profile.</p>
    <a href="index.html" class="btn btn-blue" style="display:inline-block; text-decoration:none;">⬅ Back to Profiles</a>
  </div>

  <div id="admin-view" class="card" style="display:none;">
    <div class="center-wrap" style="margin-bottom:6px;">
      <span style="font-weight:700; color:#2563eb;">Current Balance: <span id="admin-balance">0</span> DB</span>
    </div>

    <label class="field-label" for="title-input">What's this for?</label>
    <input type="text" id="title-input" placeholder="e.g. Cleaned his room">

    <label class="field-label" for="amount-input">How many Dado Bucks?</label>
    <input type="number" id="amount-input" min="1" placeholder="e.g. 10">

    <div class="btn-row">
      <button class="btn btn-green" id="add-btn">➕ Add</button>
      <button class="btn btn-red" id="subtract-btn">➖ Subtract</button>
    </div>

    <div class="error-msg" id="admin-error"></div>
    <div class="success-banner" id="success-banner"></div>
  </div>

  <div id="passcode-view" class="card" style="display:none;">
    <button class="btn btn-blue" id="show-change-passcode-btn">🔑 Change Passcode</button>
    <div id="change-passcode-form" style="display:none; margin-top:6px;">
      <label class="field-label" for="new-passcode-input">New passcode (4-6 digits)</label>
      <input type="password" id="new-passcode-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <label class="field-label" for="confirm-passcode-input">Confirm new passcode</label>
      <input type="password" id="confirm-passcode-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <div class="error-msg" id="passcode-change-error"></div>
      <div class="success-banner" id="passcode-change-success"></div>
      <button class="btn btn-green" id="save-passcode-btn">💾 Save New Passcode</button>
    </div>
  </div>

  <footer class="foot">Shhh, this page is just for grown-ups! 🤫</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
