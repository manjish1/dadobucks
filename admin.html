<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Dado Bucks Bank</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑🏽‍💼</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🧑🏽‍💼 Dado Bucks Bank</h1>
    <div class="sub">Parent Admin Zone</div>
  </header>

  <nav class="tabs">
    <a href="index.html">🏠 My Account</a>
    <a href="transactions.html">📜 History</a>
    <a href="admin.html" class="active">🔐 Admin</a>
  </nav>

  <div id="lock-view" class="card lock-screen">
    <div class="lock-emoji">🔒</div>
    <h2 style="font-family:'Baloo 2',sans-serif;">Enter Passcode</h2>
    <input type="password" id="passcode-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <div class="error-msg" id="passcode-error"></div>
    <button class="btn btn-blue" id="unlock-btn">Unlock</button>
  </div>

  <div id="admin-view" class="card" style="display:none;">
    <div class="center-wrap" style="margin-bottom:6px;">
      <span style="font-weight:700; color:#2563eb;">Current Balance: <span id="admin-balance">0</span> DB</span>
    </div>

    <label class="field-label" for="title-input">What's this for?</label>
    <input type="text" id="title-input" placeholder="e.g. Cleaned his room">

    <label class="field-label" for="amount-input">How many Dado Bucks?</label>
    <input type="number" id="amount-input" min="1" placeholder="e.g. 10">

    <div class="btn-row">
      <button class="btn btn-green" id="add-btn">➕ Add</button>
      <button class="btn btn-red" id="subtract-btn">➖ Subtract</button>
    </div>

    <div class="error-msg" id="admin-error"></div>
    <div class="success-banner" id="success-banner"></div>
  </div>

  <footer class="foot">Shhh, this page is just for grown-ups! 🤫</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
