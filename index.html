<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dado Bucks Bank</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑🏽‍💼</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🧑🏽‍💼 Dado Bucks Bank</h1>
    <div class="sub">Pick your profile!</div>
  </header>

  <div id="mode-banner-holder"></div>

  <h2 class="section-title">👦 Choose a Kid</h2>
  <div class="card">
    <div id="profile-list" class="profile-grid">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-blue" id="show-add-btn">➕ Add a New Kid</button>
    <div id="add-profile-form" style="display:none; margin-top:6px;">
      <label class="field-label" for="new-name">Kid's name</label>
      <input type="text" id="new-name" placeholder="e.g. Arjun">

      <label class="field-label" for="new-passcode">Set a passcode (4-6 digits)</label>
      <input type="password" id="new-passcode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <label class="field-label" for="new-passcode-confirm">Confirm passcode</label>
      <input type="password" id="new-passcode-confirm" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <div class="error-msg" id="create-error"></div>
      <button class="btn btn-green" id="create-btn">🎉 Create Profile</button>
    </div>
  </div>

  <footer class="foot">Every kid gets their own bank! 🏦</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/profiles.js"></script>
</body>
</html>
